[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrail"
version = "0.1.0"
description = "Safe, stage-based workflow control plane for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "imthi16" }]
keywords = ["ai-agents", "coding-agents", "orchestration", "git-worktree", "tmux"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "libtmux>=0.58,<0.61",  # pre-1.0: pin narrow, re-verify object model on upgrade
    "GitPython>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5"]
remote = ["fastapi>=0.111", "uvicorn>=0.30"]  # v0.3 remote control plane

[project.scripts]
agentrail = "agentrail.cli:main"

[tool.setuptools.packages.find]
include = ["agentrail*"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
